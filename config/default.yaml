# MPDC Default Configuration (Software Architecture First - NixOS / Ubuntu)
server:
  host: "0.0.0.0"
  port: 8000
  data_dir: "./.mpdc_data"

inference:
  # Default target: a single 6 GB GPU (e.g. RTX 3050 6GB) running Ollama.
  # Setup once: ./scripts/setup-ollama-model.sh  (creates `mpdc-qwen3-4b`, 32k context)
  # Other engines: "vllm", "sglang", "llama_cpp" (point backend_url at their /v1).
  engine: "ollama"
  backend_url: "http://127.0.0.1:11434/v1"
  api_key: "mpdc-local"

  # Qwen3-4B-Instruct-2507 (Q4_K_M, ~2.5 GB) wrapped with num_ctx=32768.
  # SICA's system prompt alone is ~12k tokens, so 32k context is the practical minimum.
  base_model: "mpdc-qwen3-4b"
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"

  # Instruct-2507 has no /think switch; directives are stripped by the gateway.
  # Set true for hybrid Qwen3 models (e.g. Qwen/Qwen3-8B) that support /think and /no_think.
  thinking_toggle: false
  enable_thinking_for_planner: true
  enable_thinking_for_coder: false
  enable_thinking_for_distiller: true

  # Dynamic Multi-LoRA state (vLLM only)
  active_adapter_name: null
  active_adapter_path: null

agents:
  max_verification_retries: 3
  top_k_skills: 4
  min_skill_similarity: 0.25

harvester:
  # 80% of solved failures go to QLoRA training; 20% go to the Golden Replay Holdout Suite
  train_split_ratio: 0.80
  min_patch_lines: 2
  # Patch Survival Rate threshold to classify a git commit as a positive "chosen" sample
  chosen_survival_threshold: 0.75

trainer:
  # Runs strictly on the local host node overnight or on `mpdc train --now`
  lora_rank: 16
  lora_alpha: 32
  learning_rate: 2.0e-4
  num_epochs: 2
  max_seq_length: 4096
  min_samples_to_train: 10
  pause_inference_during_training: true

evaluation:
  # Promotion gate thresholds for Candidate Adapter vN+1 vs Current vN
  min_replay_pass_rate_delta: 0.0     # Candidate must >= Current on Golden Replay Pass@1
  max_sanity_regression: 0.02         # Candidate cannot drop >2% on core Python/C++/Nix/ROS2 sanity checks
  require_perplexity_improvement: true

# Model pools used by the gateway's /v1/mpdc/swarm endpoint and shown in mpdc-code.
# On a 6 GB card only one model fits, so every coding role shares it. Ollama can
# hot-swap a small VLM in (e.g. `ollama pull qwen2.5vl:3b`), but only one model is
# resident at a time; enable the vision entry only if you accept that swap cost.
pools:
  coordination_mode: "specialist_graph"
  coding_models:
    - id: "qwen3-4b"
      name: "mpdc-qwen3-4b"
      role: "PLANNER_CODER_VERIFIER"
      category: "coding"
      endpoint_url: "http://127.0.0.1:11434/v1"
      thinking: false
      modalities: ["text"]
      active: true
  spatial_visual_models:
    - id: "qwen25-vl-3b"
      name: "qwen2.5vl:3b"
      role: "VLM_2D_VIDEO_CRITIC"
      category: "vision"
      endpoint_url: "http://127.0.0.1:11434/v1"
      thinking: false
      modalities: ["image"]
      active: false
