[package]
name = "mpdc-gui"
version = "0.2.0"
edition = "2021"
default-run = "mpdc-gui"
description = "Modular Rust btop++ TUI (ratatui) and Industrial Telemetry Workbench GUI (egui/eframe) for MPDC"

[lib]
name = "mpdc_ui"
path = "src/lib.rs"

[[bin]]
name = "mpdc-gui"
path = "src/bin/mpdc-gui.rs"

[[bin]]
name = "mpdc-tui"
path = "src/bin/mpdc-tui.rs"

[dependencies]
crossterm = "0.28"
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
